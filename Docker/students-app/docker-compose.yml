version: "5.1.3"
services:
  app:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - s-network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: dharm
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    networks:
      - s-network
    volumes:
      - postgres-s-data:/var/lib/postgresql/data  # Added the required container-side path

networks:
  s-network:
    driver: bridge

volumes:
  postgres-s-data:  # Declares the named volume so Docker can manage it