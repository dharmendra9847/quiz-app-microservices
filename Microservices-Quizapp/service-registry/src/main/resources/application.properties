# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=service-registry

# =========================================================
# SERVER CONFIGURATION
# =========================================================
server.port=8761

# =========================================================
# EUREKA SERVER CONFIGURATION
# =========================================================

# Hostname where Eureka Server is running
eureka.instance.hostname=localhost

# Since this is the Eureka Server itself,
# it should not register with another Eureka Server
eureka.client.register-with-eureka=false

# Eureka Server does not need to fetch registry information
eureka.client.fetch-registry=false

# Optional: Disable self-preservation in development
# (Avoid using in production)
eureka.server.enable-self-preservation=false
